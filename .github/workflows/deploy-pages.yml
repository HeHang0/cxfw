name: Deploy H5 preview to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run type-check

      - name: Create .env from repository variables
        env:
          VITE_TENCENT_WEATHER_BASE_URL: ${{ vars.VITE_TENCENT_WEATHER_BASE_URL }}
          VITE_CFMOTO_APP_SECRET: ${{ vars.VITE_CFMOTO_APP_SECRET }}
          VITE_CFMOTO_BASE_URL: ${{ vars.VITE_CFMOTO_BASE_URL }}
          VITE_TENCENT_MAP_KEY: ${{ vars.VITE_TENCENT_MAP_KEY }}
        run: |
          cat > .env <<EOF
          VITE_TENCENT_WEATHER_BASE_URL=${VITE_TENCENT_WEATHER_BASE_URL}
          VITE_CFMOTO_APP_SECRET=${VITE_CFMOTO_APP_SECRET}
          VITE_CFMOTO_BASE_URL=${VITE_CFMOTO_BASE_URL}
          VITE_TENCENT_MAP_KEY=${VITE_TENCENT_MAP_KEY}
          EOF

      - name: Build H5
        run: npm run build:h5
        env:
          VITE_PUBLIC_BASE: ${{ steps.pages.outputs.base_path }}

      - name: Disable Jekyll
        run: touch dist/build/h5/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/build/h5

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
